<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Game Hứng Táo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
      background-color: #eef2f6;
    }

    .hud {
      width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    #start-btn {
      padding: 8px 18px;
      font-size: 16px;
      font-weight: bold;
      background-color: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #start-btn:hover {
      background-color: #1d4ed8;
    }

    /* Khung game đúng kích thước và thuộc tính yêu cầu */
    #game-container {
      width: 500px;
      height: 400px;
      border: 2px solid #334155;
      border-radius: 12px;
      background-color: #f8fafc;
      position: relative;
      overflow: hidden;
    }

    /* Giỏ hứng ở đáy màn hình */
    #basket {
      width: 80px;
      height: 20px;
      background-color: #8b4513;
      border-radius: 4px;
      position: absolute;
      bottom: 10px;
      left: 210px;
    }

    /* Quả táo rơi tự do */
    #apple {
      width: 24px;
      height: 24px;
      background-color: #ef4444;
      border-radius: 50%;
      position: absolute;
      top: 0px;
      left: 238px;
      display: none;
    }

    /* Thông báo Game Over */
    #game-over {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      font-weight: bold;
      color: #dc2626;
      background-color: rgba(255, 255, 255, 0.9);
      padding: 16px 28px;
      border-radius: 10px;
      border: 2px solid #dc2626;
      display: none;
    }
  </style>
</head>
<body>
  <div class="hud">
    <div>Điểm: <span id="score">0</span></div>
    <div>Mạng sống: <span id="lives">3</span></div>
    <button id="start-btn">Bắt đầu</button>
  </div>

  <div id="game-container">
    <div id="apple"></div>
    <div id="basket"></div>
    <div id="game-over">Game Over</div>
  </div>

  <script>
    const gameContainer = document.getElementById("game-container");
    const basket = document.getElementById("basket");
    const apple = document.getElementById("apple");
    const scoreDisplay = document.getElementById("score");
    const livesDisplay = document.getElementById("lives");
    const startBtn = document.getElementById("start-btn");
    const gameOverText = document.getElementById("game-over");

    // Kích thước các thành phần
    const containerWidth = 500;
    const containerHeight = 400;
    const basketWidth = 80;
    const basketHeight = 20;
    const basketBottomOffset = 10;
    const appleSize = 24;

    // Biến trạng thái game
    let score = 0;
    let lives = 3;
    let basketLeft = 210;
    let appleTop = 0;
    let appleLeft = 0;
    let fallSpeed = 3;
    let gameLoop = null;
    let isRunning = false;

    // Đặt lại vị trí quả táo ngẫu nhiên trên đỉnh
    function resetApple() {
      appleTop = 0;
      appleLeft = Math.floor(Math.random() * (containerWidth - appleSize));
      apple.style.top = appleTop + "px";
      apple.style.left = appleLeft + "px";
    }

    // Bắt đầu / Chơi lại game
    function startGame() {
      clearInterval(gameLoop);

      score = 0;
      lives = 3;
      fallSpeed = 3;
      basketLeft = (containerWidth - basketWidth) / 2;
      isRunning = true;

      scoreDisplay.textContent = score;
      livesDisplay.textContent = lives;
      basket.style.left = basketLeft + "px";
      gameOverText.style.display = "none";
      apple.style.display = "block";

      resetApple();

      // Vòng lặp cập nhật vị trí quả táo mỗi 20ms
      gameLoop = setInterval(updateGame, 20);
    }

    // Xử lý logic rơi, va chạm và kết thúc game
    function updateGame() {
      appleTop += fallSpeed;
      apple.style.top = appleTop + "px";

      // Tính tọa độ 4 cạnh của quả táo và giỏ hứng
      const appleBottom = appleTop + appleSize;
      const appleRight = appleLeft + appleSize;

      const basketTop = containerHeight - basketBottomOffset - basketHeight;
      const basketBottom = containerHeight - basketBottomOffset;
      const basketRight = basketLeft + basketWidth;

      // 1. Kiểm tra va chạm (Collision Detection)
      const isHitBasket =
        appleBottom >= basketTop &&
        appleTop <= basketBottom &&
        appleRight >= basketLeft &&
        appleLeft <= basketRight;

      if (isHitBasket) {
        score++;
        scoreDisplay.textContent = score;
        fallSpeed += 0.3; // Tăng nhẹ tốc độ rơi
        resetApple();
        return;
      }

      // 2. Kiểm tra táo rơi chạm đáy khung game
      if (appleBottom >= containerHeight) {
        lives--;
        livesDisplay.textContent = lives;

        if (lives <= 0) {
          endGame();
        } else {
          resetApple();
        }
      }
    }

    // Kết thúc game
    function endGame() {
      clearInterval(gameLoop);
      isRunning = false;
      apple.style.display = "none";
      gameOverText.style.display = "block";
    }

    // Điều khiển giỏ bằng phím mũi tên Trái / Phải
    document.addEventListener("keydown", (event) => {
      if (!isRunning) return;

      const moveStep = 25;
      if (event.key === "ArrowLeft") {
        basketLeft = Math.max(0, basketLeft - moveStep);
      } else if (event.key === "ArrowRight") {
        basketLeft = Math.min(containerWidth - basketWidth, basketLeft + moveStep);
      }

      basket.style.left = basketLeft + "px";
    });

    startBtn.addEventListener("click", startGame);
  </script>
</body>
</html>
